<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | JSS Tailoring Akademi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <main class="auth-card">
      <a class="brand" href="index.html">
        <span class="brand-mark">J</span>
        <span>JSS Tailoring Akademi</span>
      </a>
      <p class="auth-tagline">Materials, assignments, and submissions in one place.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" type="button">Log in</button>
        <button class="auth-tab" id="tab-signup" type="button">Create account</button>
      </div>

      <!-- ---------------- Log in ---------------- -->
      <form class="form" id="login-form">
        <label class="field">
          <span>Email address</span>
          <input type="email" id="login-email" autocomplete="email" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <button class="btn btn-primary" type="submit" id="login-submit">Log in</button>
      </form>

      <!-- ---------------- Sign up ---------------- -->
      <form class="form hidden" id="signup-form">
        <label class="field">
          <span>Full name</span>
          <input type="text" id="signup-name" autocomplete="name" required />
        </label>
        <label class="field">
          <span>Email address</span>
          <input type="email" id="signup-email" autocomplete="email" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input
            type="password"
            id="signup-password"
            autocomplete="new-password"
            minlength="6"
            required
          />
          <small class="field-hint">At least 6 characters.</small>
        </label>

        <div class="field">
          <span>I am joining as</span>
          <div class="role-picker">
            <label class="role-option">
              <input type="radio" name="role" value="student" checked />
              <span>🎓 Student</span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="lecturer" />
              <span>🏫 Lecturer</span>
            </label>
          </div>
        </div>

        <button class="btn btn-primary" type="submit" id="signup-submit">Create account</button>
      </form>

      <p class="form-message" id="auth-message"></p>
      <p class="auth-footnote">← <a href="index.html">Back to the homepage</a></p>
    </main>

    <div class="toast" id="toast"></div>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
